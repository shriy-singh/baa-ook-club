<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#c9d6a5">
<title>Baa-ook Club · Offline</title>
<style>
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; box-sizing: border-box;
    background: #c9d6a5; color: #2e2622; font: 500 18px/1.5 system-ui, sans-serif; text-align: center;
  }
  .card {
    max-width: 380px; background: #fdf8ef; border: 2px solid #2e2622; border-radius: 22px;
    padding: 28px 24px; box-shadow: 5px 7px 0 #74755d;
  }
  img { width: 88px; height: 88px; border-radius: 20px; border: 2px solid #2e2622; margin: 0 auto 14px; display: block; }
  h1 { font-size: 24px; margin: 0 0 8px; }
  p { margin: 0 0 18px; }
  button {
    font: inherit; font-weight: 800; padding: 10px 22px; border-radius: 999px; border: 2px solid #2e2622;
    background: #2e2622; color: #fdf8ef; cursor: pointer;
  }
</style>
</head>
<body>
  <div class="card">
    <img src="/icons/icon-192.png" alt="">
    <h1>Woolf has wandered off</h1>
    <p>You're offline. The hosts need the internet to read your book and talk, so come back once you're connected.</p>
    <button onclick="location.reload()">Try again</button>
  </div>
</body>
</html>
