# Publishes the case study (case-study/) to GitHub Pages on every push to main.
name: Publish case study

on:
  push:
    branches: [main]
    paths: ["case-study/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: case-study
      - id: deployment
        uses: actions/deploy-pages@v4
